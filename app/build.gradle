plugins {
    id 'com.android.application'
}

android {
    namespace 'com.robomaze.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.robomaze.game'
        minSdk 23
        targetSdk 34
        versionCode 5
        versionName '5.0-surreal'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
