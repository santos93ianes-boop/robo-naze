name: ROBO MAZE - GERAR APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "principal" ]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Localizar projeto Android
        id: project
        shell: bash
        run: |
          SETTINGS=$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado. Envie o conteúdo do ZIP para a raiz do repositório."
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Gerar APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --version
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Localizar APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.dir }}" -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi encontrado."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/saida"
          cp "$APK" "$GITHUB_WORKSPACE/saida/RoboMaze.apk"
          echo "apk=$GITHUB_WORKSPACE/saida/RoboMaze.apk" >> "$GITHUB_OUTPUT"

      - name: Baixar RoboMaze APK
        uses: actions/upload-artifact@v4
        with:
          name: RoboMaze-APK
          path: saida/RoboMaze.apk
          if-no-files-found: error
          retention-days: 30
