name: Build ROBO MAZE APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permissao ao Gradle
        run: chmod +x gradlew

      - name: Gerar APK
        run: ./gradlew assembleDebug

      - name: Preparar APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/ROBO-MAZE.apk

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ROBO-MAZE-APK
          path: apk/ROBO-MAZE.apk
          if-no-files-found: errorname: Build ROBO MAZE APK

