name: ROBO MAZE - GERAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar Gradle
        run: |
          gradle --version

      - name: Gerar APK
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Localizar APK
        run: |
          find . -type f -name "*.apk"

      - name: Preparar RoboMaze APK
        run: |
          mkdir -p apk-final
          APK=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK nao encontrado"
            exit 1
          fi

          cp "$APK" apk-final/ROBO-MAZE.apk

      - name: Baixar RoboMaze APK
        uses: actions/upload-artifact@v4
        with:
          name: ROBO-MAZE-APK
          path: apk-final/ROBO-MAZE.apk
          if-no-files-found: error
